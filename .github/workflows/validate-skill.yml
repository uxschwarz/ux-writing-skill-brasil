name: Validate Skill Package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and validate skill package
      run: bash ./build-skill.sh

    - name: Upload skill package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ux-writing-skill-brasil
        path: dist/ux-writing-skill-brasil.zip
